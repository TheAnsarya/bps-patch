# ========================================================================================================
# BPS Patch - Continuous Integration Workflow
# ========================================================================================================
# This workflow builds and tests the BPS Patch library across multiple platforms.
#
# STATUS: DISABLED BY DEFAULT
# This workflow only runs on manual trigger (workflow_dispatch) to avoid unexpected costs.
# See docs/CI_ACTIVATION.md for instructions on enabling automatic CI.
# ========================================================================================================

name: CI Build and Test

# DISABLED: Only runs on manual trigger
# To enable automatic CI, uncomment the 'push' and 'pull_request' triggers below
on:
  workflow_dispatch:  # Manual trigger only - keeps costs at zero
    inputs:
      run_benchmarks:
        description: 'Run benchmarks (slower)'
        required: false
        default: 'false'
        type: boolean

  # UNCOMMENT TO ENABLE AUTOMATIC CI:
  # push:
  #   branches: [ master, main, develop ]
  #   paths-ignore:
  #     - '**.md'
  #     - 'docs/**'
  # pull_request:
  #   branches: [ master, main ]
  #   paths-ignore:
  #     - '**.md'
  #     - 'docs/**'

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore bps-patch.sln

    - name: Build solution
      run: dotnet build bps-patch.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test src/BpsPatch.Core.Tests/BpsPatch.Core.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: '**/test-results.trx'

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event.inputs.run_benchmarks == 'true'
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Run benchmarks
      run: dotnet run --configuration Release --project src/BpsPatch.Core.Benchmarks/BpsPatch.Core.Benchmarks.csproj -- --filter "*" --exporters json

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: BenchmarkDotNet.Artifacts/
